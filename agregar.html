<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Img/Icono2.ico">
    <title>Agregar Productos | Saint Burger</title>
    <link rel="stylesheet" href="Iconos/style.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="brand">
                <a href="index.html"><img src="Img/Logo2.png" alt="Logo Saint Burger"></a>
                <a href="index.html" class="brand-name">Saint Burger</a>
            </div>
            <button class="menu-toggle icon-menu3" id="menu-toggle" aria-label="Abrir menú"></button>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="lista.html">Listado</a></li>
                    <li><a href="pedidos.html">Realizar Pedido</a></li>
                    <li><a href="modificar.html">Modificar</a></li>
                    <li><a href="eliminar.html">Eliminar</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-page">
            <div class="form-card">
                <h1>Agregar Producto</h1>
                <form id="form-agregar">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="codigo">Codigo</label>
                            <input type="text" id="codigo" name="codigo" required>
                        </div>
                        <div class="form-group">
                            <label for="descripcion">Descripcion</label>
                            <input type="text" id="descripcion" name="descripcion" required>
                        </div>
                        <div class="form-group">
                            <label for="cantidad">Cantidad</label>
                            <input type="number" id="cantidad" name="cantidad" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="precio">Precio</label>
                            <input type="number" id="precio" name="precio" step="0.01" min="0" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Agregar Producto</button>
                        <a href="lista.html" class="btn btn-secondary">Ver Listado</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <ul class="social-links">
            <li><a href="https://www.facebook.com/profile.php?id=100055273845013" target="_blank"><span class="icon-facebook2"></span></a></li>
            <li><a href="https://instagram.com/saint.burger?igshid=YmMyMTA2M2Y=" target="_blank"><span class="icon-instagram"></span></a></li>
            <li><a href="" target="_blank"><span class="icon-whatsapp"></span></a></li>
            <li><a href="https://github.com/codoacodo-unidad-1/Proyecto_SaintBuger_grupo2.git" target="_blank"><span class="icon-github"></span></a></li>
        </ul>
    </footer>

    <script src="js/nav.js"></script>
    <script src="js/agregar.js"></script>
</body>
</html>
